spring.application.name=investment-tracker
app.bootstrap-admin-email=${ADMIN_EMAIL:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/investment}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migration tooling is staged only; existing local schema management is unchanged.
# Enable only after the baseline and restore procedure in docs/DATABASE_MIGRATIONS.md.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true

# Mail SMTP Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Verification code security (single backend instance; see docs/AUTH_SECURITY.md).
security.verification.code-lifetime=15m
security.verification.request-window=1h
security.verification.attempt-window=15m
security.verification.resend-cooldown=60s
security.verification.requests-per-email=3
security.verification.requests-per-ip=20
security.verification.registrations-per-ip=5
security.verification.attempts-per-email=5
security.verification.attempts-per-ip=30
security.verification.logins-per-email=10
security.verification.logins-per-ip=30
security.verification.maximum-limit-entries=10000
security.verification.expired-code-retention-days=7
security.verification.cleanup-cron=0 0 4 * * ?

# Authentication and browser security
security.jwt.secret=${JWT_SECRET}
security.jwt.access-expiration-minutes=30
security.jwt.issuer=${JWT_ISSUER:investment-tracker}
security.jwt.audience=${JWT_AUDIENCE:investment-tracker-web}
security.auth.remembered-refresh-days=60
security.auth.session-refresh-hours=24
security.auth.refresh-cookie-name=refresh_token
security.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
security.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
security.auth.expired-session-retention-days=7
security.auth.cleanup-cron=0 30 3 * * ?
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend.base-url=${APP_FRONTEND_URL:http://localhost:3000}

# Scheduling configuration
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduling-

# Jackson configuration for JSON parsing
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── Application Cache Configuration ───────────────────────────────────────
# Durations accept Spring formats such as 15m, 12h, or 1d and can be
# overridden through the corresponding environment variables.
cache.cs-items-search.ttl=${CACHE_CS_ITEMS_SEARCH_TTL:12h}
cache.price-history-chart.ttl=${CACHE_PRICE_HISTORY_CHART_TTL:15m}
cache.portfolio-summary.ttl=${CACHE_PORTFOLIO_SUMMARY_TTL:15m}
cache.tracked-items.ttl=${CACHE_TRACKED_ITEMS_TTL:15m}
cache.inventory-calculator.ttl=${CACHE_INVENTORY_CALCULATOR_TTL:15m}
cache.initial-capacity=${CACHE_INITIAL_CAPACITY:100}
cache.maximum-size=${CACHE_MAXIMUM_SIZE:1000}

# ─── Price Tracking Configuration ───────────────────────────────────────────
# Check the shared CSGOTrader feed every 2 hours. Conditional HTTP headers avoid
# downloading and recording the same feed version twice.
price.update.rate-ms=7200000
price.feed.check-interval-ms=7200000
# Shortly after every startup, capture the latest available feed observation.
price.update.initial-delay-ms=5000
# How many days of PriceHistory to retain before auto-pruning. Default: 90 days.
price.history.retention-days=90
# Shared CSGOTrader observations retain a 30-day buffer beyond the 3-month chart.
price.snapshot.retention-days=120
# Cron expression for the daily PriceHistory prune job. Default: every day at 03:00.
price.history.prune-cron=0 0 3 * * ?
