# ─── Price Tracking Configuration ───────────────────────────────────────────
# How often to run the scheduled price update (milliseconds). Default: 12 hours (43200000 ms).
price.update.rate-ms=43200000
# How long to wait after startup before the first price update (milliseconds). Default: 1 min.
price.update.initial-delay-ms=60000
# How many days of PriceHistory to retain before auto-pruning. Default: 90 days.
price.history.retention-days=90
# Cron expression for the daily PriceHistory prune job. Default: every day at 03:00.
price.history.prune-cron=0 0 3 * * ?
