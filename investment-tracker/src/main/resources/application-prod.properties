spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
security.auth.cookie-secure=true
server.forward-headers-strategy=framework
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Production values must be provided through environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET,
# CORS_ALLOWED_ORIGINS, JWT_ISSUER and JWT_AUDIENCE.
