spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
security.auth.cookie-secure=true
# Do not let an arbitrary public forwarding header reset IP admission budgets.
# Trusted proxy forwarding must be explicitly configured at the deployment stage.
server.forward-headers-strategy=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Production values must be provided through environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET,
# CORS_ALLOWED_ORIGINS, JWT_ISSUER and JWT_AUDIENCE.
