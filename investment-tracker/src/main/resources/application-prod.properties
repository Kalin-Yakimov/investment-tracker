spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${APP_FRONTEND_URL}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE}
security.auth.cookie-secure=true
security.auth.cookie-same-site=Strict
# Supported deployment: one same-host TLS proxy; neither Java port is public.
server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
server.tomcat.threads.max=100
server.tomcat.accept-count=50
server.tomcat.max-connections=200
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=16KB
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.log-request-details=false
logging.structured.format.console=ecs
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.jmx.enabled=false
management.server.address=127.0.0.1
management.server.port=8081
management.endpoints.web.exposure.exclude=
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Production values must be provided through environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET,
# CORS_ALLOWED_ORIGINS, JWT_ISSUER and JWT_AUDIENCE.
