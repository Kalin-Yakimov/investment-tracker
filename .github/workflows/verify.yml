name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

# Verification only: no repository writes, deployments or application secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: Operations template checks (no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify backup wrapper and deployment contracts
        run: python3 -m unittest discover -s ops/tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react/investment-tracker
    env:
      VITE_API_URL: http://localhost:8080
      VITE_ITEM_SEARCH_DEBOUNCE_MS: "1000"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: react/investment-tracker/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check code quality
        run: npm run lint
      - name: Run frontend tests
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Build frontend
        run: npm run build
      - name: Check production routes and assets
        run: npm run smoke:build
      - name: Upload frontend test report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-report
          path: react/investment-tracker/reports/vitest-junit.xml
          retention-days: 7
          if-no-files-found: warn

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: investment-tracker
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: investment_test_ci
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Disposable service credentials; never production database credentials.
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:33306/investment_test_ci
      MYSQL_TEST_USERNAME: root
      MYSQL_TEST_PASSWORD: ephemeral-ci-only
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            investment-tracker/build.gradle
            investment-tracker/settings.gradle
            investment-tracker/gradle/wrapper/gradle-wrapper.properties
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Run backend tests and build
        run: ./gradlew --no-daemon --console=plain test mysqlTest bootJar migrationBootJar
      - name: Upload backend test and coverage reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            investment-tracker/build/test-results/test/TEST-*.xml
            investment-tracker/build/reports/tests/test/
            investment-tracker/build/test-results/mysqlTest/TEST-*.xml
            investment-tracker/build/reports/tests/mysqlTest/
            investment-tracker/build/reports/jacoco/test/
          retention-days: 7
          if-no-files-found: warn
